<div id="root"><div id="loading-fallback">Loading ZenSpend…</div></div>
<script>
  // Diagnostic + resilience layer: on some mobile browsers (in-app
  // browsers, older Safari/WebView versions) the module script below can
  // fail silently — the page just sits on "Loading ZenSpend…" forever
  // with no visible error. This surfaces whatever actually went wrong.
  (function () {
    var reported = false;
    function showError(msg) {
      if (reported) return;
      reported = true;
      var el = document.getElementById('loading-fallback');
      if (!el) return; // app already mounted successfully
      el.innerHTML =
        '<div style="max-width:420px;padding:24px;text-align:center;line-height:1.5;">' +
        '<div style="font-weight:600;margin-bottom:8px;">ZenSpend couldn\'t load</div>' +
        '<div style="font-size:13px;color:#7a5c5c;word-break:break-word;">' + msg + '</div>' +
        '<div style="font-size:12px;color:#a08888;margin-top:12px;">Try again in Safari or Chrome directly (not an in-app browser), and check your connection.</div>' +
        '</div>';
    }
    window.addEventListener('error', function (e) {
      showError((e && (e.message || (e.error && e.error.message))) || 'Unknown script error.');
    });
    window.addEventListener('unhandledrejection', function (e) {
      var reason = e && e.reason;
      showError((reason && (reason.message || String(reason))) || 'Unknown loading error.');
    });
    // Safety-net: if nothing has replaced the fallback within 12s, the
    // module script likely never finished (e.g. blocked network request,
    // unsupported import map) without throwing a catchable error.
    setTimeout(function () {
      showError('Taking too long to load — this usually means a required script (React/Firebase) was blocked. Check your internet connection or try a different browser.');
    }, 12000);
  })();
</script>
